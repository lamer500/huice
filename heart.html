<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>蓝色钻石动态爱心</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="heart"></canvas>
<script>
var settings = {
  // 爱心粒子颜色（蓝色钻石系）
  heartColor: 'rgba(63,208,255,.9)',
  // 下方光池颜色（青色）
  poolColor: '150,255,235'
};

window.requestAnimationFrame =
  window.requestAnimationFrame ||
  window.webkitRequestAnimationFrame ||
  function (cb) { setTimeout(cb, 1000 / 60); };

var init = function () {
  var mobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);
  var koef = mobile ? 0.5 : 1;
  var canvas = document.getElementById('heart');
  var ctx = canvas.getContext('2d');
  var width, height, heartPosition, areaWidth, areaHeight;

  var resize = function () {
    width = canvas.width = koef * window.innerWidth;
    height = canvas.height = koef * window.innerHeight;
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.fillRect(0, 0, width, height);
    // 爱心中心（偏上，给下方光池留空间）
    heartPosition = function (rad) {
      return [
        Math.pow(Math.sin(rad), 3),
        -(15 * Math.cos(rad) - 5 * Math.cos(2 * rad) -
          2 * Math.cos(3 * rad) - Math.cos(4 * rad))
      ];
    };
    areaWidth = width / 2;
    areaHeight = height / 2;
  };
  window.addEventListener('resize', resize);
  resize();

  var traceCount = mobile ? 20 : 50;
  var pointsOrigin = [];
  var i;
  var dr = mobile ? 0.3 : 0.1;

  // 三层缩放，做出"实心"爱心
  for (i = 0; i < Math.PI * 2; i += dr)
    pointsOrigin.push(scaleAndTranslate(heartPosition(i), 210, 13, 0, 0));
  for (i = 0; i < Math.PI * 2; i += dr)
    pointsOrigin.push(scaleAndTranslate(heartPosition(i), 150, 9, 0, 0));
  for (i = 0; i < Math.PI * 2; i += dr)
    pointsOrigin.push(scaleAndTranslate(heartPosition(i), 90, 5, 0, 0));

  var heartPointsCount = pointsOrigin.length;

  var targetPoints = [];
  var pulse = function (kx, ky) {
    for (i = 0; i < pointsOrigin.length; i++) {
      targetPoints[i] = [];
      targetPoints[i][0] = kx * pointsOrigin[i][0] + areaWidth;
      targetPoints[i][1] = ky * pointsOrigin[i][1] + areaHeight * 0.72;
    }
  };

  var e = [];
  for (i = 0; i < heartPointsCount; i++) {
    var x = Math.random() * width;
    var y = Math.random() * height;
    e[i] = {
      vx: 0, vy: 0,
      R: 2,
      speed: Math.random() + 5,
      q: ~~(Math.random() * heartPointsCount),
      D: 2 * (i % 2) - 1,
      force: 0.2 * Math.random() + 0.7,
      f: 'hsla(' + (~~(190 + 25 * Math.random())) + ',95%,' +
         (~~(60 + 25 * Math.random())) + '%,.9)',
      trace: []
    };
    for (var k = 0; k < traceCount; k++) e[i].trace[k] = { x: x, y: y };
  }

  var config = { traceK: 0.4, timeDelta: 0.01 };
  var time = 0;

  // ===== 下方青色光池粒子 =====
  var pool = [];
  var poolCount = mobile ? 120 : 260;
  var spawnPool = function (p) {
    p.x = areaWidth + (Math.random() - 0.5) * width * 0.5;
    p.y = height * 0.78 + (Math.random() - 0.5) * 20;
    p.vx = (Math.random() - 0.5) * 3.5;
    p.vy = -Math.random() * 3.5 - 0.5;
    p.life = 0;
    p.maxLife = 40 + Math.random() * 60;
    p.r = Math.random() * 2 + 0.5;
  };
  for (i = 0; i < poolCount; i++) { pool[i] = {}; spawnPool(pool[i]); }

  var loop = function () {
    var n = -Math.cos(time);
    pulse((1 + n) * 0.5, (1 + n) * 0.5);
    time += ((Math.sin(time)) < 0 ? 9 : (n > 0.8) ? 0.2 : 1) * config.timeDelta;

    // 拖尾渐隐（半透明黑覆盖）
    ctx.fillStyle = 'rgba(0,0,0,.1)';
    ctx.fillRect(0, 0, width, height);

    // --- 青色光池 ---
    for (i = 0; i < poolCount; i++) {
      var pp = pool[i];
      pp.x += pp.vx;
      pp.y += pp.vy;
      pp.vy += 0.04;         // 轻微重力
      pp.vx *= 0.99;
      pp.life++;
      var alpha = Math.max(0, 1 - pp.life / pp.maxLife);
      ctx.beginPath();
      ctx.fillStyle = 'rgba(' + settings.poolColor + ',' + (alpha * 0.9) + ')';
      ctx.arc(pp.x, pp.y, pp.r, 0, Math.PI * 2);
      ctx.fill();
      if (pp.life >= pp.maxLife || pp.y > height) spawnPool(pp);
    }

    // --- 爱心粒子 ---
    for (i = e.length; i--;) {
      var u = e[i];
      var q = targetPoints[u.q];
      var dx = u.trace[0].x - q[0];
      var dy = u.trace[0].y - q[1];
      var length = Math.sqrt(dx * dx + dy * dy);
      if (length < 10) {
        if (Math.random() > 0.95) {
          u.q = ~~(Math.random() * heartPointsCount);
        } else {
          if (Math.random() > 0.99) u.D *= -1;
          u.q += u.D;
          u.q %= heartPointsCount;
          if (u.q < 0) u.q += heartPointsCount;
        }
      }
      u.vx += -dx / length * u.speed;
      u.vy += -dy / length * u.speed;
      u.trace[0].x += u.vx;
      u.trace[0].y += u.vy;
      u.vx *= u.force;
      u.vy *= u.force;
      for (k = 0; k < u.trace.length - 1;) {
        var T = u.trace[k];
        var N = u.trace[++k];
        N.x -= config.traceK * (N.x - T.x);
        N.y -= config.traceK * (N.y - T.y);
      }
      ctx.fillStyle = u.f;
      for (k = 0; k < u.trace.length; k++) {
        ctx.fillRect(u.trace[k].x, u.trace[k].y, 1, 1);
      }
    }

    window.requestAnimationFrame(loop);
  };
  loop();
};

function scaleAndTranslate(p, sx, sy, dx, dy) {
  return [dx + p[0] * sx, dy + p[1] * sy];
}

window.onload = init;
</script>
</body>
</html>
