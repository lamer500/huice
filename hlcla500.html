<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow-x:hidden}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f1117;color:#e2e8f0;font-size:14px;padding-bottom:env(safe-area-inset-bottom)}
  .hdr{background:linear-gradient(135deg,#1a1f2e,#16213e);padding:14px 16px 10px;border-bottom:1px solid #2d3748;position:sticky;top:0;z-index:100}
  .hdr h1{font-size:17px;font-weight:700;color:#63b3ed}
  .hdr .sub{font-size:11px;color:#718096;margin-top:2px}
  .seg-row{display:flex;overflow-x:auto;gap:6px;padding:10px 16px;background:#0f1117;border-bottom:1px solid #1e2535;scrollbar-width:none}
  .seg-row::-webkit-scrollbar{display:none}
  .seg-btn{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:#1a1f2e;border:1px solid #2d3748;color:#718096;transition:all .15s;white-space:nowrap}
  .seg-btn:active{opacity:.7}
  .seg-btn.g-active{background:#7c3aed;border-color:#7c3aed;color:#fff}
  .seg-btn.s-active{background:#2b6cb0;border-color:#2b6cb0;color:#fff}
  .seg-btn.r-active{background:#1a3a20;border-color:#276749;color:#68d391}
  .seg-btn.v-active{background:#2d1f4a;border-color:#553c9a;color:#b794f4}
  .content{padding:14px 16px}
  .alloc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .alloc-tag{font-size:12px;background:#1a1f2e;border:1px solid #2d3748;border-left-width:3px;border-radius:6px;padding:4px 10px;color:#e2e8f0}
  .alloc-tag strong{margin-left:4px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .card{background:#1a1f2e;border:1px solid #2d3748;border-radius:10px;padding:13px;border-left-width:3px}
  .card .lbl{font-size:11px;color:#718096;margin-bottom:4px}
  .card .val{font-size:20px;font-weight:700;line-height:1.2}
  .card .sub{font-size:11px;color:#718096;margin-top:3px}
  .pos{color:#68d391} .neg{color:#fc8181}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .leg{display:flex;align-items:center;gap:5px;font-size:11px;color:#a0aec0}
  .leg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
  .chart-card{background:#1a1f2e;border:1px solid #2d3748;border-radius:10px;padding:14px;margin-bottom:12px}
  .chart-card h3{font-size:12px;color:#a0aec0;margin-bottom:12px;font-weight:600}
  .chart-box{position:relative;height:200px}
  .chart-box.tall{height:240px}
  .tbl-card{background:#1a1f2e;border:1px solid #2d3748;border-radius:10px;overflow:hidden;margin-bottom:12px}
  .tbl-hdr{padding:10px 14px;border-bottom:1px solid #2d3748;font-size:12px;color:#a0aec0;font-weight:600}
  .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:11px}
  th{background:#161b27;padding:7px 10px;text-align:center;font-weight:600;color:#718096;white-space:nowrap;position:sticky;top:0}
  th:first-child{text-align:left;position:sticky;left:0;z-index:2;background:#161b27}
  td{padding:6px 10px;border-bottom:1px solid #1e2535;text-align:center;white-space:nowrap}
  td:first-child{text-align:left;color:#a0aec0;font-weight:600;position:sticky;left:0;background:#1a1f2e;z-index:1}
  tr:last-child td{border-bottom:none}
  .source-box{background:#161b27;border:1px solid #2d3748;border-left:3px solid #4a5568;border-radius:8px;padding:11px 13px;margin-bottom:12px;font-size:11px;color:#a0aec0;line-height:1.8}
  .source-box strong{color:#63b3ed}
  .tbl-toolbar{padding:8px 14px;border-bottom:1px solid #2d3748;display:flex;justify-content:space-between;align-items:center}
  .tbl-toolbar h4{font-size:11px;color:#718096}
  .search-box{background:#0f1117;border:1px solid #2d3748;border-radius:6px;padding:5px 9px;color:#e2e8f0;font-size:12px;width:130px;outline:none}
  .pager{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid #2d3748;font-size:11px;color:#718096}
  .pg-btn{background:#2d3748;border:none;color:#a0aec0;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px}
  .pg-btn:disabled{opacity:.4}
</style>

        <div class="val neg">${fmtPctNeg(sd.max_dd)}</div>

      </div>
      <div class="card" style="border-left-color:#fbd38d">
        <div class="lbl">期初加权股息率</div>
        <div class="val" style="color:#fbd38d">${weightedDy()}</div>
        <div class="sub">按权重 × TTM 加权</div>
      </div>
    </div>

    <div class="legend">
      <div class="leg"><span class="leg-dot" style="background:${sc}"></span><span>${curS} · ${sm.title}</span></div>
      ${keys.map(k => `<div class="leg"><span class="leg-dot" style="background:${SINGLE_META[k].color}"></span><span>${SINGLE_META[k].name}</span></div>`).join('')}
    </div>

    <div class="chart-card"><h3>净值曲线（全收益, 月末采样）</h3><div class="chart-box tall"><canvas id="nav-c"></canvas></div></div>
    <div class="chart-card"><h3>每年收益率（%）</h3><div class="chart-box"><canvas id="ret-c"></canvas></div></div>
    <div class="chart-card"><h3>每年最大回撤（%）</h3><div class="chart-box"><canvas id="dd-c"></canvas></div></div>

    <div class="tbl-card">
      <div class="tbl-hdr">年度数据 — ${curG} · ${curS}（${REBAL_LABELS[curR]}）</div>
      <div class="tbl-scroll"><table>
        <thead><tr><th>年份</th><th>策略收益</th><th>策略最大回撤</th>${keys.map(k => `<th>${SINGLE_META[k].name}收益</th>`).join('')}</tr></thead>
        <tbody>${YEARS.map(y => {
          const row = sd.annual.find(r => r.year === y) || {ret: null, dd: null};
          const single = keys.map(k => {
            const r = SINGLES[k].annual.find(r => r.year === y);
            return r ? `<td class="${r.ret >= 0 ? 'pos' : 'neg'}">${fmtPct(r.ret)}</td>` : '<td>—</td>';
          }).join('');
          return `<tr><td>${y}</td>
            <td class="${row.ret >= 0 ? 'pos' : 'neg'}">${row.ret != null ? fmtPct(row.ret) : '—'}</td>
            <td class="neg">${row.dd != null ? fmtPctNeg(row.dd) : '—'}</td>
            ${single}</tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>

    <div class="source-box">
      <strong>数据口径：</strong>全收益（含分红再投资）日线序列。<br>
      <strong>价格源：</strong>妙想 API 日线收盘价（中证A500 / 980081 / 980092 / H30269）。<br>
      <strong>分红近似：</strong>每只指数加 DB 中 TTM 平均股息率/252（${keys.map(k => `${SINGLE_META[k].name} ${DY[k].avg}%`).join('，')}）。<br>
      <strong>标普红利低波代理：</strong>用 H30269（中证红利低波动）替代 SPCLLHCT.SPI（妙想无直接 K线）。<br>
      <strong>再平衡：</strong>每个再平衡日按目标权重重设仓位。回测期 ${PAYLOAD.DATE_START} ~ ${PAYLOAD.DATE_END}，共 ${PAYLOAD.N_DAYS} 个交易日。
    </div>
  `;

  const navDs = [{
    label: curS, data: sd.navs,
    borderColor: sc, backgroundColor: sc + '18',
    borderWidth: 2, pointRadius: 0, fill: false, tension: 0.3
  }];
  keys.forEach(k => {
    navDs.push({
      label: SINGLE_META[k].name, data: SINGLES[k].navs,
      borderColor: SINGLE_META[k].color, backgroundColor: SINGLE_META[k].color + '18',
      borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.3
    });
  });
  charts.nav = new Chart(document.getElementById('nav-c'), {
    type: 'line', data: {labels: DATES, datasets: navDs}, options: cOpts(true, false)
  });

  function annArr(src, f) {
    const m = {}; src.annual.forEach(r => m[r.year] = r[f]);
    return YEARS.map(y => m[y] ?? null);
  }
  function barDs(f) {
    const ds = [{
      label: curS, data: annArr(sd, f),
      backgroundColor: sc + '99', borderColor: sc, borderWidth: 1, borderRadius: 3
    }];
    keys.forEach(k => {
      ds.push({
        label: SINGLE_META[k].name, data: annArr(SINGLES[k], f),
        backgroundColor: SINGLE_META[k].color + '99', borderColor: SINGLE_META[k].color, borderWidth: 1, borderRadius: 3
      });
    });
    return ds;
  }
  charts.ret = new Chart(document.getElementById('ret-c'), {
    type: 'bar', data: {labels: YEARS, datasets: barDs('ret')}, options: cOpts(true, false)
  });
  charts.dd = new Chart(document.getElementById('dd-c'), {
    type: 'bar', data: {labels: YEARS, datasets: barDs('dd')}, options: cOpts(true, true)
  });
}

function weightedDy() {
  const meta = curStratMeta();
  const nameToKey = {};
  Object.entries(SINGLE_META).forEach(([k, v]) => nameToKey[v.name] = k);
  let total = 0;
  meta.tags.forEach(t => {
    const k = nameToKey[t[0]];
    const w = parseFloat(t[1]) / 100;
    if (DY[k] && DY[k].now !== '—') total += w * parseFloat(DY[k].now);
  });
  return total.toFixed(2) + '%';
}

function renderValidate() {
  if (vChart) {vChart.destroy(); vChart = null;}
  if (vRetChart) {vRetChart.destroy(); vRetChart = null;}
  const code = curV, meta = SINGLE_META[code], col = meta.color;
  const allRows = RAW[code];
  const filtered = vFilter ? allRows.filter(r => r.date.includes(vFilter)) : allRows;
  const rev = [...filtered].reverse();
  const total = rev.length, pages = Math.ceil(total / vPS);
  const slice = rev.slice(vPage * vPS, (vPage + 1) * vPS);
  const annData = SINGLES[code].annual;

  document.getElementById('vcontent').innerHTML = `
    <div class="source-box">
      <strong>指数：</strong>${meta.name}<br>
      <strong>当前TTM股息率：</strong>${meta.dy_now}<br>
      <strong>全收益CAGR：</strong>${fmtPct(SINGLES[code].cagr)}　|　<strong>最大回撤：</strong>${fmtPctNeg(SINGLES[code].max_dd)}　|　<strong>夏普：</strong>${SINGLES[code].sharpe}<br>
      <strong>数据范围：</strong>${allRows[0].date} ~ ${allRows[allRows.length - 1].date}（共 ${allRows.length} 个交易日）
    </div>
    <div class="chart-card"><h3>全收益净值 (起点=1)</h3><div class="chart-box tall"><canvas id="v-price-c"></canvas></div></div>
    <div class="chart-card"><h3>每年收益率（%）</h3><div class="chart-box"><canvas id="v-ret-c"></canvas></div></div>
    <div class="tbl-card">
      <div class="tbl-toolbar">
        <h4>原始日线（全收益单位化, ${total} 条）</h4>
        <input class="search-box" placeholder="筛选日期" value="${vFilter}" oninput="vFilter=this.value;vPage=0;renderValidate()">
      </div>
      <div class="tbl-scroll"><table>
        <thead><tr><th>#</th><th>日期</th><th>TR净值</th><th>日涨跌</th></tr></thead>
        <tbody>${slice.map((r, i) => `<tr>
          <td style="color:#4a5568;font-size:10px">${total - vPage * vPS - i}</td>
          <td>${r.date}</td><td><strong>${r.tr}</strong></td>
          <td>${r.ret != null ? `<span class="${r.ret >= 0 ? 'pos' : 'neg'}">${r.ret >= 0 ? '+' : ''}${r.ret}%</span>` : '—'}</td>
        </tr>`).join('')}</tbody>
      </table></div>
      <div class="pager">
        <button class="pg-btn" onclick="vPage--;renderValidate()" ${vPage === 0 ? 'disabled' : ''}>‹</button>
        <span>${vPage + 1} / ${pages}</span>
        <button class="pg-btn" onclick="vPage++;renderValidate()" ${vPage >= pages - 1 ? 'disabled' : ''}>›</button>
        <span style="margin-left:auto;font-size:10px">每页 ${vPS} 条</span>
      </div>
    </div>`;

  vRetChart = new Chart(document.getElementById('v-ret-c'), {
    type: 'bar',
    data: {
      labels: annData.map(r => r.year),
      datasets: [{
        label: '年收益率', data: annData.map(r => r.ret),
        backgroundColor: annData.map(r => r.ret >= 0 ? col + 'aa' : 'rgba(252,129,129,0.7)'),
        borderColor: annData.map(r => r.ret >= 0 ? col : '#fc8181'),
        borderWidth: 1, borderRadius: 3
      }]
    },
    options: cOpts(false, false)
  });

  const step = Math.max(1, Math.floor(allRows.length / 300));
  const sampled = allRows.filter((_, i) => i % step === 0);
  vChart = new Chart(document.getElementById('v-price-c'), {
    type: 'line',
    data: {
      labels: sampled.map(r => r.date),
      datasets: [{
        label: meta.name, data: sampled.map(r => r.tr),
        borderColor: col, backgroundColor: col + '18',
        borderWidth: 2, pointRadius: 0, fill: true, tension: 0.3
      }]
    },
    options: cOpts(false, false)
  });
}

function setMode(mode) {
  curMode = mode;
  const isBack = mode === 'backtest';
  document.getElementById('main-view').style.display = isBack ? '' : 'none';
  document.getElementById('validate-view').style.display = isBack ? 'none' : '';
  document.getElementById('rtabs').style.display = isBack ? '' : 'none';
  updateTabs();
  if (isBack) renderBacktest(); else renderValidate();
}

function updateTabs() {
  document.querySelectorAll('.g-btn').forEach(b => b.classList.toggle('g-active', b.dataset.key === curG));
  document.querySelectorAll('.s-btn').forEach(b => b.classList.toggle('s-active', b.dataset.key === curS && curMode === 'backtest'));
  document.querySelectorAll('.r-btn').forEach(b => b.classList.toggle('r-active', b.dataset.key === curR));
  document.querySelectorAll('.v-btn').forEach(b => b.classList.toggle('v-active',
    (b.dataset.key === 'validate' && curMode === 'validate') ||
    (curMode === 'validate' && b.dataset.key === curV)));
  document.getElementById('hdr-sub').textContent = '2014-01-02 ~ 2026-05-11 · 3000个交易日 · 全收益 · ' + curG + ' · ' + REBAL_SHORT[curR];
}

function rebuildVTabs() {
  const vtabsEl = document.getElementById('vtabs');
  vtabsEl.innerHTML = '';
  curGroupKeys().forEach(code => {
    const b = document.createElement('button');
    b.className = 'seg-btn v-btn'; b.dataset.key = code;
    b.style.borderLeft = '3px solid ' + SINGLE_META[code].color;
    b.textContent = SINGLE_META[code].name;
    b.onclick = () => {
      curV = code; vPage = 0; vFilter = '';
      document.querySelectorAll('#vtabs .v-btn').forEach(x => x.classList.remove('v-active'));
      b.classList.add('v-active');
      renderValidate();
    };
    vtabsEl.appendChild(b);
  });
}

// Build tabs
const gtabsEl = document.getElementById('gtabs');
GROUP_KEYS.forEach(g => {
  const b = document.createElement('button');
  b.className = 'seg-btn g-btn'; b.dataset.key = g;
  b.textContent = g;
  b.onclick = () => {
    curG = g;
    curV = GROUP_META[g].single_keys[0];
    rebuildVTabs();
    updateTabs();
    if (curMode === 'backtest') renderBacktest(); else renderValidate();
  };
  gtabsEl.appendChild(b);
});

const stabsEl = document.getElementById('stabs');
['策略一', '策略二', '策略三'].forEach(key => {
  const b = document.createElement('button');
  b.className = 'seg-btn s-btn'; b.dataset.key = key;
  b.textContent = key;
  b.onclick = () => {curS = key; curMode = 'backtest'; updateTabs(); renderBacktest();};
  stabsEl.appendChild(b);
});
const vb = document.createElement('button');
vb.className = 'seg-btn v-btn'; vb.dataset.key = 'validate';
vb.textContent = '📊 验证';
vb.onclick = () => setMode('validate');
stabsEl.appendChild(vb);

const rtabsEl = document.getElementById('rtabs');
Object.entries(REBAL_LABELS).forEach(([freq, label]) => {
  const b = document.createElement('button');
  b.className = 'seg-btn r-btn'; b.dataset.key = freq;
  b.textContent = REBAL_SHORT[freq];
  b.onclick = () => {curR = freq; updateTabs(); renderBacktest();};
  rtabsEl.appendChild(b);
});

rebuildVTabs();
updateTabs();
document.querySelector('.r-btn').classList.add('r-active');
renderBacktest();
</script>
</body></html>
